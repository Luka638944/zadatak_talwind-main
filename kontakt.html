<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt  -  OPG Rendula</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
      <header class="sticky top-0 p-4 font-semibold bg-red-200 border-b border-blue-500">
        <div class="max-w-5xl mx-auto px-8 py-2  items-center justify-between">
            <a href="index.html" class=" text-2xl font-bold text-red-700 text-center" >OPG Rendula - Kontakt</a>
            <nav class="hidden md:flex gap-5">
             <a href="index.html" class="text-lg font-bold text-blue-700 hover:text-orange-700" >Početna</a>
            <a href="kontakt.html" class="text-lg font-bold text-blue-700 hover:text-orange-700" >Kontakt</a>
            <a href="zivotinje.html" class="text-lg font-bold text-blue-700 hover:text-orange-700">Životinje</a>
            </nav>
        </div>
    </header>
            <nav class="md:hidden bg-yellow-200 border-b border-blue-500">
        <div  class="flex justify-around py-2 text-sm">
                <a href="index.html" class="text-lg font-bold text-blue-700 hover:text-orange-700 font-semibold">Početna</a>
                <a href="kontakt.html" class="text-lg font-bold text-blue-700 hover:text-orange-700 font-semibold">Kontakt</a>
                <a href="zivotinje.html" class="text-lg font-bold text-blue-700 hover:text-orange-700 font-semibold">Životinje</a>
        </div>
    </nav>

   <section class="max-w-2xl mx-auto px-10 py-12">
    <h1 class="text-3xl  text-blue-500 font-bold mb-6">Kontakt</h1>

    <form class="flex flex-col gap-4">

        <div class="flex flex-col md:flex-row gap-4">

            <div class="flex flex-col gap-1 w-full">
                <label for="name" class="text-sm font-medium text-blue-700 font-semibold">Ime i prezime</label>
                <input type="text" id="name" name="name" class="border border-green-500 rounded-md px-6 py-5 focus:border-amber-600 focus:outline-none">
            </div>

            <div class="flex flex-col gap-1 w-full">
                <label for="email" class="text-sm font-medium text-blue-700 font-semibold">E-mail adresa</label>
                <input type="email" id="email" name="email" class="border border-green-500 rounded-md px-6 py-5 focus:border-amber-600 focus:outline-none">
                
            </div>

            <div class="flex flex-col gap-1 w-full">
                <label for="phone" class="text-sm font-medium text-blue-700 font-semibold">Broj telefona</label>
                <input type="tel" id="phone" name="phone" class="border border-green-500 rounded-md px-6 py-5 focus:border-amber-600 focus:outline-none">
            </div>

        </div>

        <div class="flex flex-col gap-1">
            <label for="message" class="text-sm font-medium text-blue-700 font-semibold">Koju i koliko životinja želite kupiti?</label>
            <textarea id="message" name="message" rows="4"
            class="border border-green-500 rounded-md px-10 py-8 focus:border-amber-600 focus:outline-none"></textarea>

        </div>

        <button class="bg-red-600 text-blue-100 text-lg font-bold px-10 py-6 rounded-lg hover:bg-red-500">
            Pošalji zahtjev za kupnju životinja
        </button>

    </form>
  </section>

    <footer class="bg-green-700 text-white py-5 mt-8">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between gap-4 text-sm">
            <p><strong>OPG Rendula </strong>- Poljoprivredno gospodarstvo</p>
            <p><strong>Adresa </strong>Ulica Augusta Šenoe 38, Koprivnica, <strong>E-mail</strong>: opg.rendula@gmail.com, <strong>Telefon</strong>: 047/123-4562</p>
        
        </div>
    </footer>
</body>
</html>
